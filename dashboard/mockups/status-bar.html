<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>状态条示意 · Hermes 运行状态</title>
<style>
  body { margin:0; background:#0b1220; color:#e2e8f0; font-family:system-ui,"Microsoft YaHei",sans-serif; }
  .demo-wrap { padding: 18px 22px; }
  .demo-note { color:#94a3b8; font-size:12px; margin: 0 0 10px; }
  /* 以下与 dashboard 注入版一致 */
  .kg-status-bar {
    display: flex; align-items: center; gap: 10px;
    margin: 0 0 8px 0; padding: 7px 12px;
    background: rgba(15, 23, 42, 0.72);
    border: 1px solid rgba(56, 189, 248, 0.18);
    border-radius: 8px; font-size: 12.5px; line-height: 1.5;
    flex-wrap: wrap; min-width: max-content; width: 100%; box-sizing: border-box;
  }
  .kg-status-bar .kg-sb-title { color: #93c5fd; font-weight: 600; }
  .kg-status-bar .kg-sb-item {
    display: inline-flex; align-items: center; gap: 5px; color: #cbd5e1;
    padding: 1px 7px; border-radius: 5px; background: rgba(30, 41, 59, 0.5);
    border: 1px solid rgba(71, 85, 105, 0.35);
  }
  .kg-status-bar .kg-sb-dot { width: 8px; height: 8px; border-radius: 50%; background: #475569; flex-shrink: 0; }
  .kg-status-bar .kg-sb-dot.kg-sb-on { background: #34d399; box-shadow: 0 0 6px rgba(52, 211, 153, 0.7); }
  .kg-status-bar .kg-sb-cur { border-color: rgba(56, 189, 248, 0.5); background: rgba(14, 116, 144, 0.4); }
  .kg-status-bar .kg-sb-cur .kg-sb-name { color: #7dd3fc; }
  .kg-status-bar .kg-sb-cur .kg-sb-dot:not(.kg-sb-on) { background: #38bdf8; }
  .kg-status-bar .kg-sb-cur .kg-sb-tag { color: #38bdf8; font-size: 11px; margin-left: 2px; }
  .kg-status-bar .kg-sb-counts { color: #e2e8f0; margin-left: 4px; }
  .kg-status-bar .kg-sb-counts .kg-sb-num { color: #7dd3fc; font-weight: 600; }
  .kg-status-bar .kg-sb-hint { color: #64748b; font-size: 11px; margin-left: auto; }
</style>
</head>
<body>
<div class="demo-wrap">
  <p class="demo-note">静态示意（真机版绿点来自 ps 探测：gateway 进程 cwd=&lt;home&gt;/.hermes/profiles/&lt;profile&gt; 且 HOME 匹配；桌面主对话为 AppImage 内嵌引擎、无独立 gateway 进程，故不亮绿）</p>
  <div class="kg-status-bar" id="bar"></div>
</div>
<script>
  const rows = [
    { name:'liteguard', label:'当前会话', on:true,  cur:true },
    { name:'default',   label:'桌面主对话', on:false },
    { name:'coding',    label:'代码', on:false },
    { name:'study',     label:'学科', on:false },
  ];
  const bar = document.getElementById('bar');
  const mk = (cls,text) => { const s=document.createElement('span'); if(cls)s.className=cls; if(text!=null)s.textContent=text; return s; };
  bar.appendChild(mk('kg-sb-title','Hermes 运行中'));
  rows.forEach(r=>{
    const it = mk('kg-sb-item'); if(r.cur) it.classList.add('kg-sb-cur');
    const dot = mk('kg-sb-dot'); if(r.on) dot.classList.add('kg-sb-on');
    it.appendChild(dot);
    it.appendChild(mk('kg-sb-name', r.name));
    it.appendChild(mk('kg-sb-label',' · '+r.label));
    if(r.cur) it.appendChild(mk('kg-sb-tag',' ▸当前'));
    bar.appendChild(it);
  });
  const c = mk('kg-sb-counts'); c.innerHTML='全部任务 <b class="kg-sb-num">12</b> · 在办 <b class="kg-sb-num">3</b>';
  bar.appendChild(c);
  bar.appendChild(mk('kg-sb-hint','点我:切会话方式'));
</script>
</body>
</html>
